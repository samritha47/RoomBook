<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RoomBook - Meeting Room Booking</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; }
        header { background: #243447; color: white; padding: 22px; text-align: center; }
        .container { width: 90%; max-width: 1000px; margin: 25px auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 2px 8px #ddd; }
        input { padding: 9px; margin: 5px; width: 180px; }
        button { padding: 9px 14px; margin: 5px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 9px; text-align: left; }
        th { background: #eee; }
        .message { padding: 10px; margin-top: 10px; }
    </style>
</head>
<body>
<header>
    <h1>RoomBook</h1>
    <p>Meeting Room Booking with Conflict Detection</p>
</header>

<div class="container">

    <div class="card">
        <h2>Add Employee</h2>
        <input id="employeeName" placeholder="Name">
        <input id="employeeEmail" placeholder="Email">
        <input id="employeeDept" placeholder="Department">
        <button onclick="addEmployee()">Add Employee</button>
    </div>

    <div class="card">
        <h2>Add Room</h2>
        <input id="roomName" placeholder="Room Name">
        <input id="roomCapacity" type="number" placeholder="Capacity">
        <label><input id="projector" type="checkbox"> Projector</label>
        <label><input id="whiteboard" type="checkbox"> Whiteboard</label>
        <label><input id="active" type="checkbox" checked> Active</label>
        <button onclick="addRoom()">Add Room</button>
    </div>

    <div class="card">
        <h2>Book Room</h2>
        <input id="roomId" type="number" placeholder="Room ID">
        <input id="employeeId" type="number" placeholder="Employee ID">
        <input id="startTime" type="datetime-local">
        <input id="endTime" type="datetime-local">
        <input id="attendees" type="number" placeholder="Attendees">
        <button onclick="bookRoom()">Confirm Booking</button>
        <div id="message"></div>
    </div>

    <div class="card">
        <h2>Rooms</h2>
        <button onclick="loadRooms()">Refresh Rooms</button>
        <div id="rooms"></div>
    </div>

    <div class="card">
        <h2>Bookings</h2>
        <button onclick="loadBookings()">Refresh Bookings</button>
        <div id="bookings"></div>
    </div>
</div>

<script>
async function send(url, method, data) {
    const options = { method: method, headers: {"Content-Type": "application/json"} };
    if (data !== undefined) options.body = JSON.stringify(data);
    const response = await fetch(url, options);
    const text = await response.text();
    let result;
    try { result = JSON.parse(text); } catch { result = text; }
    if (!response.ok) throw new Error(result.error || result);
    return result;
}

async function addEmployee() {
    try {
        const result = await send("/employees", "POST", {
            name: document.getElementById("employeeName").value,
            email: document.getElementById("employeeEmail").value,
            department: document.getElementById("employeeDept").value
        });
        alert("Employee created. ID: " + result.id);
    } catch (e) { alert(e.message); }
}

async function addRoom() {
    try {
        const result = await send("/rooms", "POST", {
            name: document.getElementById("roomName").value,
            capacity: Number(document.getElementById("roomCapacity").value),
            projector: document.getElementById("projector").checked,
            whiteboard: document.getElementById("whiteboard").checked,
            active: document.getElementById("active").checked
        });
        alert("Room created. ID: " + result.id);
    } catch (e) { alert(e.message); }
}

async function bookRoom() {
    try {
        const result = await send("/bookings", "POST", {
            roomId: Number(document.getElementById("roomId").value),
            employeeId: Number(document.getElementById("employeeId").value),
            startTime: document.getElementById("startTime").value,
            endTime: document.getElementById("endTime").value,
            attendees: Number(document.getElementById("attendees").value)
        });
        document.getElementById("message").innerText = "Booking confirmed. ID: " + result.id;
        loadBookings();
    } catch (e) {
        document.getElementById("message").innerText = e.message;
    }
}

async function loadRooms() {
    try {
        const rooms = await send("/rooms", "GET");
        let html = "<table><tr><th>ID</th><th>Name</th><th>Capacity</th><th>Projector</th><th>Whiteboard</th><th>Active</th></tr>";
        rooms.forEach(r => {
            html += `<tr><td>${r.id}</td><td>${r.name}</td><td>${r.capacity}</td><td>${r.projector}</td><td>${r.whiteboard}</td><td>${r.active}</td></tr>`;
        });
        html += "</table>";
        document.getElementById("rooms").innerHTML = html;
    } catch (e) { alert(e.message); }
}

async function loadBookings() {
    try {
        const bookings = await send("/bookings", "GET");
        let html = "<table><tr><th>ID</th><th>Room ID</th><th>Employee ID</th><th>Start</th><th>End</th><th>Attendees</th><th>Status</th><th>Action</th></tr>";
        bookings.forEach(b => {
            html += `<tr>
                <td>${b.id}</td><td>${b.roomId}</td><td>${b.employeeId}</td>
                <td>${b.startTime}</td><td>${b.endTime}</td><td>${b.attendees}</td><td>${b.status}</td>
                <td>
                    <button onclick="checkIn(${b.id})">Check In</button>
                    <button onclick="cancelBooking(${b.id})">Cancel</button>
                </td>
            </tr>`;
        });
        html += "</table>";
        document.getElementById("bookings").innerHTML = html;
    } catch (e) { alert(e.message); }
}

async function checkIn(id) {
    try { await send("/bookings/" + id + "/check-in", "PUT"); loadBookings(); }
    catch (e) { alert(e.message); }
}

async function cancelBooking(id) {
    try { await send("/bookings/" + id + "/cancel", "PUT"); loadBookings(); }
    catch (e) { alert(e.message); }
}
</script>
</body>
</html>
